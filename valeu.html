<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <title>Zero ao Investidor-Valeu!</title>
    <link rel="icon" href="assets/icone.png">
<style>
    body {
      margin: 0 auto;
      justify-content: center;
      align-items: center;
      background-image: url("assets/foto1.png");
      overflow-x: hidden;
      box-sizing: border-box;
    }

    .banner {
      height: 100px;
      margin: 0 auto;
      top: 0;
      box-shadow: #000000;
      position: fixed;
      box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.3);
      text-align: center;
      margin-right: 0px;
      margin-left: 0px;
      background-image: linear-gradient(to right, #045de1, #05206a, #264489);
      justify-content: center;
      display: flex;
      width: 100%;
      align-items: center;
      justify-content: center;
      margin-top: 0px; 
    }

    .card {
      height: 100px;
      width: 300px;
      display: flex;
      justify-content: center;
      flex-direction: column;
      padding: 20px;
      text-align: center;
      margin: 0 auto;
      box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.3);
      background-image: linear-gradient(to right, #1979b9, #1505be, #ebebfe);
      align-items: center;
      border-radius: 20px;
      animation: fadein 1s ease-in-out;
    }

    .card:hover {
      scale: 1.02;
    }

    .button{ 
      background-color: #a3d3ff;
      border-radius: 10px;
      width: 70px;
      margin: 0 auto;
      display: flex;
      height: 70px;
      border: none;
      justify-content: center;
      text-align: center;
      padding: 10px;
      align-items: center;
    }

    .button:hover{
      background-color: #0750af;
      transform: scale(1.05);
      box-shadow: 10px 10px 10px #000000;
    }

    .button:active{
      transform: scale(1.10);
    }

    @keyframes fadein {
      from {opacity: 0; transform: translateY(20px);}
      to {opacity: 1; transform: translateY(0px);}
    }

</style>
  </head>
  <body>
    <header></header>
    <main></main>
    <footer></footer>

    <div class="banner">
      <h1 style="font:sans-serif;">ZERO AO INVESTIDOR</h1>
    </div>

    <div>
      <a href="index.html" class="button" style="color: black; text-decoration: none; width: 90px; height: 30px; margin-top: 150px;"><-- Voltar</a>
    </div>

    <div style="margin-top: 2%;" class="card">
      <h1> Agradecemos pelo feedback!</h1>
    </div>
        
    </body>
</html>
